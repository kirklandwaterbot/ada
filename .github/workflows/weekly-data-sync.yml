name: Daily MTA data snapshot sync

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:data
      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily MTA data snapshots"
          file_pattern: data/mta-subway-elevator-escalator-assets.* data/mta-equipment-status.json data/mta-capital-elevator-escalator-projects.json data/ada-project-statuses.json data/mta-regional-rail-accessibility.json data/path-accessibility.json data/ewr-airtrain-accessibility.json data/nj-transit-accessibility.json data/ctrail-accessibility.json data/sync-metadata.json public/data/nyc-subway-routes.geojson public/data/mta-regional-rail-routes.geojson public/data/path-routes.geojson public/data/ewr-airtrain-routes.geojson public/data/nj-transit-routes.geojson public/data/ctrail-routes.geojson
